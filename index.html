<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Healthy Life</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --background:#f4f8fc;--surface:#ffffff;--surface-low:#eaf2fb;--surface-high:#d5e6f9;--surface-highest:#c2dbf5;
    --border:#cfe0f2;--on-surface:#0f2438;--on-surface-variant:#4c6a86;
    --primary:#2f8dff;--on-primary:#ffffff;--secondary:#22b8cf;--tertiary:#5b6bff;--error:#e5484d;
    --amber:#f59e0b;--green:#22c55e;--pink:#ec4899;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{
    --background:#0b1626;--surface:#122031;--surface-low:#0e1a2a;--surface-high:#213850;--surface-highest:#2b4661;
    --border:#28405a;--on-surface:#e7f1fb;--on-surface-variant:#9db4cb;
    --primary:#4fa3ff;--on-primary:#00223f;--secondary:#3fd0e5;--tertiary:#8b98ff;--error:#ff8a80;
    --amber:#fbbf24;--green:#4ade80;--pink:#f472b6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--background);color:var(--on-surface);font-family:'Plus Jakarta Sans',sans-serif;min-height:100%;padding-bottom:76px;}
  .disp{font-family:'Space Grotesk',sans-serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  header.bar{border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
  .barin{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 16px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem}
  .brand span{color:var(--primary)}
  nav.links{display:flex;gap:4px;flex-wrap:wrap}
  nav.links a{padding:8px 14px;border-radius:999px;font-size:.9rem;font-weight:600;color:var(--on-surface-variant)}
  nav.links a.active{background:var(--primary);color:var(--on-primary)}
  nav.links a:hover:not(.active){background:var(--surface-high);color:var(--on-surface)}
  .userbox{display:flex;align-items:center;gap:10px;font-size:.9rem}
  .userbox span{color:var(--on-surface-variant);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button,.btn{cursor:pointer;font-family:inherit}
  .btn-primary{height:46px;padding:0 18px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-weight:700;border:none;box-shadow:0 8px 20px -8px rgba(47,141,255,.5)}
  .btn-primary:disabled{opacity:.6;cursor:default;box-shadow:none}
  .btn-ghost{height:36px;padding:0 12px;border-radius:999px;background:var(--surface-high);color:var(--on-surface);border:none}
  .btn-sub{height:40px;padding:0 16px;border-radius:999px;background:var(--secondary);color:#fff;font-weight:700;border:none}
  input,select{background:var(--surface-low);border:1px solid var(--border);color:var(--on-surface);border-radius:14px;padding:0 14px;height:46px;font-family:inherit;font-size:.95rem;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--primary)}
  label{display:block;font-size:.85rem;margin-bottom:6px;color:var(--on-surface-variant)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 6px 18px -12px rgba(34,28,20,.15)}
  .pill{border-radius:16px;border:1px solid var(--border);background:var(--surface-low);padding:14px;cursor:pointer;text-align:left;color:var(--on-surface);font-family:inherit;font-size:.95rem;width:100%}
  .pill.sel{border-color:var(--primary);background:rgba(47,141,255,.1);color:var(--primary);font-weight:700}
  main{min-height:70vh}
  .grid3{display:grid;grid-template-columns:2fr 1fr;gap:22px}
  @media (max-width:860px){.grid3{grid-template-columns:1fr}}
  .stack{display:flex;flex-direction:column;gap:16px}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (max-width:600px){.row3{grid-template-columns:1fr}}
  .muted{color:var(--on-surface-variant)}
  .loginwrap{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:24px}
  .loginbox{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:30px;box-shadow:0 12px 30px -16px rgba(34,28,20,.2)}
  .badge{font-size:.72rem;color:var(--primary);border:1px solid rgba(47,141,255,.3);background:rgba(47,141,255,.1);border-radius:999px;padding:4px 10px}
  .err{color:var(--error);font-size:.9rem}
  .ok{color:var(--secondary);font-size:.9rem}
  .kpi{background:var(--surface-low);border-radius:16px;padding:12px}
  .kpi p:first-child{font-size:.75rem;color:var(--on-surface-variant);margin:0 0 4px}
  .kpi p:last-child{margin:0;font-weight:700;font-family:'Space Grotesk',sans-serif}
  .goalbox{background:rgba(47,141,255,.1);border:1px solid rgba(47,141,255,.25);border-radius:16px;padding:12px;margin-top:14px}
  .bar-outer{height:8px;background:var(--surface-high);border-radius:999px;overflow:hidden;margin-top:8px}
  .bar-inner{height:100%;background:var(--primary)}
  ul.entries{list-style:none;margin:0;padding:0}
  ul.entries li{padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  ul.entries li:last-child{border-bottom:none}
  .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--on-surface-variant);margin-right:8px}
  .ring{width:110px;height:110px;border-radius:50%;border:4px solid var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
  .ring b{font-family:'Space Grotesk',sans-serif;font-size:1.4rem}
  .ring small{font-size:.65rem;color:var(--on-surface-variant)}
  .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:600px){.macros{grid-template-columns:1fr}}
  .macros>div{background:var(--surface-low);border-radius:18px;padding:16px;text-align:center}
  .macros b{display:block;font-family:'Space Grotesk',sans-serif;font-size:1.5rem}
  .quickrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .quickrow input{flex:1;min-width:140px}
  .quickrow select{width:auto}
  .datein{width:auto;height:40px}
  .trkhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px}
  .trendchart{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:14px}
  .trendbar{flex:1;background:var(--surface-low);border-radius:8px 8px 0 0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
  .trendbar .fill{background:var(--primary);border-radius:8px 8px 0 0;width:100%;min-height:2px}
  .trendbar .fill.over{background:var(--amber)}
  .trendbar .val{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:.65rem;color:var(--on-surface-variant)}
  .trendlbl{display:flex;gap:8px;margin-top:6px}
  .trendlbl span{flex:1;text-align:center;font-size:.68rem;color:var(--on-surface-variant)}
  code{background:var(--surface-low);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:.85em}
  .center{display:flex;align-items:center;justify-content:center}
  /* Kalguroo-style calorie ring */
  .calring-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
  .calring{position:relative;width:180px;height:180px;flex-shrink:0}
  .calring svg{transform:rotate(-90deg)}
  .calring .center-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .calring .center-txt b{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;line-height:1}
  .calring .center-txt small{font-size:.72rem;color:var(--on-surface-variant);margin-top:4px}
  .macrorow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .macrorow .mchip{text-align:center}
  .macrorow .mdot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
  /* bottom tab bar (mobile) */
  .tabbar{display:none}
  /* chatbot widget */
  .chatfab{position:fixed;right:20px;bottom:24px;width:58px;height:58px;border-radius:50%;background:var(--primary);
    color:var(--on-primary);border:none;font-size:1.5rem;box-shadow:0 10px 24px -10px rgba(47,141,255,.6);z-index:20;cursor:pointer}
  .chatpanel{position:fixed;right:20px;bottom:92px;width:320px;max-width:calc(100vw - 32px);height:440px;max-height:65vh;
    background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 16px 40px -16px rgba(15,36,56,.35);
    z-index:20;display:none;flex-direction:column;overflow:hidden}
  .chatpanel.open{display:flex}
  .chathead{background:var(--primary);color:var(--on-primary);padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .chatbody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-low)}
  .chatmsg{max-width:80%;padding:8px 12px;border-radius:14px;font-size:.85rem;line-height:1.4}
  .chatmsg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);color:var(--on-surface)}
  .chatmsg.me{align-self:flex-end;background:var(--primary);color:var(--on-primary)}
  .chatchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
  .chatchips button{font-size:.72rem;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--on-surface-variant)}
  .chatinputrow{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border)}
  .chatinputrow input{height:38px;font-size:.85rem}
  .chatinputrow button{width:38px;height:38px;border-radius:50%;background:var(--primary);color:var(--on-primary);border:none;flex-shrink:0}
  @media (max-width:760px){
    .chatfab{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
    .chatpanel{bottom:calc(146px + env(safe-area-inset-bottom,0px))}
  }
  @media (max-width:760px){
    header.bar nav.links{display:none}
    .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
      padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 -6px 18px -14px rgba(34,28,20,.3)}
    .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--on-surface-variant);font-weight:600;padding:4px}
    .tabbar a .ic{font-size:1.25rem}
    .tabbar a.active{color:var(--primary)}
  }
</style>
</head>
<body>
<div id="app" class="center" style="min-height:100vh"><p class="muted">กำลังโหลด...</p></div>

<script>
(function(){
  "use strict";

  // ================= Supabase connection =================
  const CFG_KEY = "hl_supabase_cfg"; // {url, key}
  function getCfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY)); }catch(e){ return null; } }
  function setCfg(url, key){ localStorage.setItem(CFG_KEY, JSON.stringify({ url, key })); }
  function clearCfg(){ localStorage.removeItem(CFG_KEY); }

  let sb = null;
  function initClient(){
    const cfg = getCfg();
    if(!cfg || !cfg.url || !cfg.key) return null;
    try{ return window.supabase.createClient(cfg.url, cfg.key); }catch(e){ return null; }
  }

  // ================= calculations (unchanged) =================
  const ACTIVITY_MULTIPLIERS = { sedentary:1.2, light:1.375, moderate:1.55, active:1.725, extra_active:1.9 };
  const ACTIVITY_LABELS = {
    sedentary:"นั่งทำงานเป็นหลัก (Sedentary)",
    light:"ออกกำลังกายเบาๆ (Lightly Active)",
    moderate:"ออกกำลังกายปานกลาง (Moderately Active)",
    active:"ออกกำลังกายหนัก (Very Active)",
    extra_active:"กิจกรรมนักกีฬาระดับแข่งขัน (Extra Active)"
  };
  const GOAL_ADJUSTMENT = { lose:-400, maintain:0, gain:350 };
  function calcBMI(w,h){ const m=h/100; if(m<=0) return 0; return +(w/(m*m)).toFixed(1); }
  function bmiCategory(bmi){
    if(bmi<18.5) return { label:"น้ำหนักน้อย", color:"var(--secondary)" };
    if(bmi<23) return { label:"สมส่วน (Normal)", color:"var(--green)" };
    if(bmi<25) return { label:"น้ำหนักเกิน", color:"var(--amber)" };
    return { label:"โรคอ้วน", color:"var(--error)" };
  }
  function calcBMR(sex,w,h,age){
    const base = 10*w + 6.25*h - 5*age;
    if(sex==="male") return Math.round(base+5);
    if(sex==="female") return Math.round(base-161);
    return Math.round(base-78);
  }
  function calcTDEE(bmr, activity){ return Math.round(bmr*ACTIVITY_MULTIPLIERS[activity]); }
  function calcGoalCalories(tdee, goal){ return Math.max(1200, tdee+GOAL_ADJUSTMENT[goal]); }
  function calcMacros(cal){ return { proteinG:Math.round(cal*0.3/4), carbsG:Math.round(cal*0.4/4), fatG:Math.round(cal*0.3/9) }; }
  function todayISO(){ return new Date().toISOString().slice(0,10); }

  // ================= data layer (Supabase) =================
  async function getProfile(userId){
    const { data } = await sb.from("profiles").select("*").eq("id", userId).maybeSingle();
    return data;
  }
  async function saveProfile(userId, p){
    return sb.from("profiles").upsert({ id:userId, ...p, updated_at:new Date().toISOString() });
  }
  async function getLog(userId, date){
    const { data } = await sb.from("daily_logs").select("*").eq("user_id",userId).eq("log_date",date).maybeSingle();
    return data || { log_date:date, calories_consumed:0, water_ml:0, sleep_hours:0, exercise_minutes:0, exercise_kcal:0 };
  }
  async function saveLog(userId, date, log){
    const { data } = await sb.from("daily_logs").upsert({ ...log, user_id:userId, log_date:date }, { onConflict:"user_id,log_date" }).select().maybeSingle();
    return data;
  }
  async function getEntries(dailyLogId){
    if(!dailyLogId) return [];
    const { data } = await sb.from("log_entries").select("*").eq("daily_log_id", dailyLogId).order("created_at",{ ascending:true });
    return data || [];
  }
  async function addEntry(userId, dailyLogId, entry_type, title, calories){
    const { data } = await sb.from("log_entries").insert({ daily_log_id:dailyLogId, user_id:userId, entry_type, title, calories }).select().maybeSingle();
    return data;
  }
  async function deleteEntry(id){ return sb.from("log_entries").delete().eq("id", id); }
  async function getRecentLogs(userId, days){
    const since = new Date(); since.setDate(since.getDate() - (days - 1));
    const sinceStr = since.toISOString().slice(0,10);
    const { data } = await sb.from("daily_logs").select("log_date,calories_consumed")
      .eq("user_id", userId).gte("log_date", sinceStr).order("log_date",{ ascending:true });
    return data || [];
  }
  async function getLogsForExport(userId, days){
    const since = new Date(); since.setDate(since.getDate() - (days - 1));
    const sinceStr = since.toISOString().slice(0,10);
    const { data } = await sb.from("daily_logs").select("*")
      .eq("user_id", userId).gte("log_date", sinceStr).order("log_date",{ ascending:true });
    return data || [];
  }
  function downloadCSV(rows, filename){
    const headers = ["log_date","calories_consumed","water_ml","sleep_hours","exercise_minutes","exercise_kcal"];
    const csv = [headers.join(",")].concat(rows.map(r=>headers.map(h=>r[h]??"").join(","))).join("\n");
    const blob = new Blob(["\uFEFF"+csv], { type:"text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  async function calcStreak(userId){
    const logs = await getRecentLogs(userId, 60);
    const set = new Set(logs.filter(r=>r.calories_consumed>0).map(r=>r.log_date));
    let streak = 0;
    let d = new Date();
    const todayStr = d.toISOString().slice(0,10);
    if(!set.has(todayStr)) d.setDate(d.getDate()-1);
    while(true){
      const ds = d.toISOString().slice(0,10);
      if(set.has(ds)){ streak++; d.setDate(d.getDate()-1); } else break;
    }
    return streak;
  }
  function favKey(email){ return "hl_favs_" + btoa(unescape(encodeURIComponent(email))); }

  // ================= chatbot (rule-based, no external API) =================
  const ENCOURAGE = [
    "สู้ๆ นะ! ทุกก้าวเล็กๆ ที่บันทึกวันนี้ คือความก้าวหน้าของพรุ่งนี้ 💪",
    "อย่ากดดันตัวเองมากไป แค่ทำต่อเนื่องก็เก่งมากแล้ว 🌱",
    "พักได้ แต่อย่าหยุด กลับมาบันทึกใหม่ได้เสมอนะ 🔥"
  ];
  async function botReply(user, textRaw){
    const t = textRaw.toLowerCase();
    try{
      if(/สวัสดี|hello|hi/.test(t)) return "สวัสดีค่ะ/ครับ! ถามเรื่องแคลอรี, BMI, น้ำ, การนอน, ออกกำลังกาย หรือ streak ได้เลย 😊";
      if(/วิธีใช้|help|ใช้ยังไง/.test(t)) return "เริ่มจากหน้า 'ข้อมูลสุขภาพ' กรอกสัดส่วนก่อน ระบบจะคำนวณ BMI/TDEE ให้ จากนั้นไปที่ 'บันทึกประจำวัน' เพื่อบันทึกแคลอรี น้ำ การนอน และการออกกำลังกายในแต่ละวันได้เลย";
      if(/กำลังใจ|ท้อ|เหนื่อย|หมดแรง/.test(t)) return ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)];
      if(/streak|ติดต่อกัน|ขยัน/.test(t)){
        const s = await calcStreak(user.id);
        return s>0 ? `ตอนนี้คุณบันทึกต่อเนื่อง ${s} วันแล้ว เก่งมาก! 🔥 พยายามรักษาสถิตินี้ต่อไปนะ` : "ยังไม่มี streak ตอนนี้ ลองเริ่มบันทึกวันนี้เพื่อเริ่มนับต่อเนื่องได้เลย";
      }
      if(/bmi|ดัชนีมวลกาย/.test(t)){
        const p = await getProfile(user.id);
        if(!p) return "ยังไม่มีข้อมูลสรีระของคุณเลย ไปกรอกที่หน้า 'ข้อมูลสุขภาพ' ก่อนนะ";
        const cat = bmiCategory(p.bmi);
        return `BMI ของคุณคือ ${p.bmi} kg/m² อยู่ในเกณฑ์ "${cat.label}"`;
      }
      if(/เป้าหมายแคล|เป้าหมายพลังงาน|goal.?cal/.test(t)){
        const p = await getProfile(user.id);
        if(!p) return "ยังไม่มีข้อมูลสรีระของคุณเลย ไปกรอกที่หน้า 'ข้อมูลสุขภาพ' ก่อนนะ";
        return `เป้าหมายพลังงานต่อวันของคุณคือ ${p.goal_calories} kcal (ตามเป้าหมาย: ${p.goal})`;
      }
      if(/น้ำหนักเป้าหมาย/.test(t)){
        const p = await getProfile(user.id);
        return p ? `น้ำหนักเป้าหมายของคุณคือ ${p.goal_weight_kg} กก. (ปัจจุบัน ${p.weight_kg} กก.)` : "ยังไม่มีข้อมูลสรีระเลย ไปกรอกที่หน้า 'ข้อมูลสุขภาพ' ก่อนนะ";
      }
      if(/แคล|กินไป|บริโภค/.test(t)){
        const p = await getProfile(user.id);
        const log = await getLog(user.id, todayISO());
        const goal = p?.goal_calories || 2000;
        return `วันนี้คุณบริโภคไปแล้ว ${log.calories_consumed} kcal จากเป้าหมาย ${goal} kcal (เหลืออีก ${Math.max(0,goal-log.calories_consumed)} kcal)`;
      }
      if(/น้ำ/.test(t)){
        const log = await getLog(user.id, todayISO());
        return `วันนี้คุณดื่มน้ำไปแล้ว ${log.water_ml} มล.`;
      }
      if(/นอน/.test(t)){
        const log = await getLog(user.id, todayISO());

    const body = panel.querySelector("#chatBody");
    function addMsg(text, who){
      const d = document.createElement("div");
      d.className = "chatmsg " + who; d.textContent = text;
      body.appendChild(d); body.scrollTop = body.scrollHeight;
    }
    async function handleSend(text){
      if(!text.trim()) return;
      addMsg(text, "me");
      const reply = await botReply(user, text);
      addMsg(reply, "bot");
    }
    panel.querySelector("#chatSendBtn").onclick = ()=>{
      const inp = panel.querySelector("#chatInput");
      const v = inp.value; inp.value = ""; handleSend(v);
    };
    panel.querySelector("#chatInput").onkeydown = (e)=>{

          <div><b style="color:var(--primary)">${macros.proteinG}g</b><span class="muted" style="font-size:.75rem">โปรตีน (Protein)</span></div>
          <div><b style="color:var(--amber)">${macros.carbsG}g</b><span class="muted" style="font-size:.75rem">คาร์โบไฮเดรต (Carbs)</span></div>
          <div><b style="color:var(--pink)">${macros.fatG}g</b><span class="muted" style="font-size:.75rem">ไขมัน (Fat)</span></div>
        </div>
      </section>
      <section class="card" style="margin-bottom:24px">
        <h2 class="disp" style="font-weight:600;margin:0 0 4px;font-size:1.05rem">แนวโน้มแคลอรี 7 วันย้อนหลัง</h2>
        <p class="muted" style="margin:0;font-size:.8rem">เทียบกับเป้าหมาย ${profile.goal_calories} kcal/วัน (แถบสีฟ้า = เกินเป้าหมาย)</p>
        ${recent.length===0 ? `<p class="muted" style="margin-top:14px;font-size:.9rem">ยังไม่มีข้อมูลบันทึกในช่วง 7 วันนี้ ไปที่ Daily Tracker เพื่อเริ่มบันทึก</p>` : `
        <div class="trendchart">
          ${recent.map(r=>{
            const h = Math.max(2, Math.round((r.calories_consumed/maxCal)*100));
            const over = r.calories_consumed > profile.goal_calories;
            return `<div class="trendbar"><div class="fill ${over?'over':''}" style="height:${h}%"><span class="val">${r.calories_consumed}</span></div></div>`;
          }).join("")}
        </div>
        <div class="trendlbl">${recent.map(r=>`<span>${dayLabel(r.log_date)}</span>`).join("")}</div>`}
      </section>

      <section class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
        <div>
          <p style="color:var(--primary);font-size:.85rem;margin:0 0 4px">การคาดการณ์ผลลัพธ์สุขภาพ</p>
          <p style="margin:0">ด้วยเป้าหมายนี้ คุณจะบรรลุน้ำหนักเป้าหมาย <b>${profile.goal_weight_kg} กก.</b> ได้อย่างปลอดภัยภายในประมาณ <b style="color:var(--primary)">${weeksToGoal||0} สัปดาห์</b></p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button id="exportBtn" class="btn-ghost">⬇ ส่งออก CSV (30 วัน)</button>
          <a href="#/tracker" class="btn-primary" style="display:inline-flex;align-items:center">เริ่มบันทึกใน Daily Tracker →</a>
        </div>
      </section>
    </div>`);
    document.getElementById("exportBtn").onclick = async ()=>{
      const rows = await getLogsForExport(user.id, 30);
      downloadCSV(rows, "healthy-life-export.csv");
    };
  }

  // ---------- ACCOUNT ----------
  async function renderAccount(user){
    function paint(msg, isErr, saving){
      app.innerHTML = layout("account", user.email, `
      <div class="wrap" style="max-width:520px;padding:32px 16px">
        <h1 class="disp" style="font-size:1.6rem;font-weight:700;margin:0 0 4px">บัญชีของฉัน</h1>
        <p class="muted" style="margin:0 0 22px">อีเมลที่ใช้เข้าสู่ระบบ: <b>${user.email}</b></p>
        <section class="card">
          <h2 class="disp" style="font-weight:600;margin:0 0 14px;font-size:1.05rem">เปลี่ยนรหัสผ่าน</h2>
          <form id="pwForm" class="stack">
            <div><label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label><input type="password" id="fNewPw" minlength="6" required/></div>
            <div><label>ยืนยันรหัสผ่านใหม่</label><input type="password" id="fConfirmPw" minlength="6" required/></div>
            ${msg ? `<p class="${isErr?'err':'ok'}">${msg}</p>` : ""}
            <button type="submit" class="btn-primary" style="width:100%" ${saving?'disabled':''}>${saving?'กำลังบันทึก...':'บันทึกรหัสผ่านใหม่'}</button>
          </form>
        </section>
        <section class="card" style="margin-top:20px;text-align:center">
          <h2 class="disp" style="font-weight:600;margin:0 0 6px;font-size:1.05rem">แชร์แอปด้วย QR Code</h2>
          <p class="muted" style="margin:0 0 16px;font-size:.85rem">ให้คนอื่นสแกนเพื่อเปิดแอปนี้ได้ทันที</p>
          <div id="qrbox" style="display:flex;justify-content:center;background:#fff;border-radius:14px;padding:16px;width:fit-content;margin:0 auto"></div>
        </section>
      </div>`);
      if(window.QRCode){
        document.getElementById("qrbox").innerHTML = "";
        new QRCode(document.getElementById("qrbox"), {
          text: "https://claude.ai/artifact/AUz1FvYn9NfgtnHN39CLc3",
          width: 200, height: 200, colorDark:"#0b1326", colorLight:"#ffffff"
        });
      }
      document.getElementById("pwForm").onsubmit = async (e)=>{
        e.preventDefault();
        const p1 = document.getElementById("fNewPw").value;
        const p2 = document.getElementById("fConfirmPw").value;
        if(p1 !== p2){ paint("รหัสผ่านทั้งสองช่องไม่ตรงกัน", true, false); return; }
        paint(null, false, true);
        const { error } = await sb.auth.updateUser({ password: p1 });
        if(error){ paint(error.message, true, false); }
        else{ paint("เปลี่ยนรหัสผ่านสำเร็จแล้ว", false, false); }
      };
    }
    paint(null, false, false);
  }

  // ---------- TRACKER ----------
  async function renderTracker(user){
    const profile = await getProfile(user.id);
    const goalCalories = profile?.goal_calories || 2000;
    let date = todayISO();
    let log = await getLog(user.id, date);
    let entries = await getEntries(log.id);
    let entryType = "meal";
    let favs = getFavs(user.email);
    let streak = await calcStreak(user.id);

    function paint(saving){
      const pct = Math.min(100, Math.round((log.calories_consumed / (goalCalories||1)) * 100));
      const remain = Math.max(0, goalCalories - log.calories_consumed);
      const circumf = 2*Math.PI*70;
      const dash = circumf * (pct/100);
      app.innerHTML = layout("tracker", user.email, `
      <div class="wrap" style="padding:32px 16px">
        <div class="trkhead">
          <div>
            <h1 class="disp" style="font-size:1.6rem;font-weight:700;margin:0 0 4px">บันทึกสุขภาพประจำวัน ${streak>0?`<span style="font-size:1rem;color:var(--secondary)">🔥 ${streak} วันติดต่อกัน</span>`:''}</h1>
            <p class="muted" style="margin:0;font-size:.9rem">ติดตามแคลอรี น้ำ การนอน และการออกกำลังกายของคุณ</p>
          </div>
          <input type="date" id="fDate" class="datein" value="${date}"/>
        </div>
        <section class="card" style="margin-bottom:20px">
          <div class="calring-wrap">
            <div class="calring">
              <svg viewBox="0 0 160 160" width="180" height="180">
                <circle cx="80" cy="80" r="70" fill="none" stroke="var(--surface-high)" stroke-width="14"/>
                <circle cx="80" cy="80" r="70" fill="none" stroke="var(--primary)" stroke-width="14"
                  stroke-linecap="round" stroke-dasharray="${dash} ${circumf}"/>
              </svg>
              <div class="center-txt"><b>${remain}</b><small>kcal เหลือวันนี้</small></div>
            </div>
            <div class="macrorow">
              <div class="mchip"><span class="mdot" style="background:var(--primary)"></span><b class="disp">${log.calories_consumed}</b><div class="muted" style="font-size:.72rem">บริโภคแล้ว</div></div>
              <div class="mchip"><span class="mdot" style="background:var(--border);border:2px solid var(--on-surface-variant)"></span><b class="disp">${goalCalories}</b><div class="muted" style="font-size:.72rem">เป้าหมาย</div></div>
              <div class="mchip"><span class="mdot" style="background:var(--green)"></span><b class="disp">${log.exercise_kcal||0}</b><div class="muted" style="font-size:.72rem">เผาผลาญ</div></div>
            </div>
          </div>
        </section>
        <form id="logForm" class="row3" style="grid-template-columns:repeat(4,1fr);margin-bottom:26px">
          <div class="card" style="padding:16px">
            <p class="muted" style="font-size:.75rem;margin:0 0 4px">แคลอรีวันนี้</p>
            <p class="disp" style="font-size:1.4rem;font-weight:700;margin:0">${log.calories_consumed} <span class="muted" style="font-size:.7rem">/ ${goalCalories} kcal</span></p>
            <div class="bar-outer"><div class="bar-inner" style="width:${pct}%"></div></div>
            <input type="number" id="fCal" value="${log.calories_consumed}" style="margin-top:10px;height:36px;font-size:.85rem"/>
          </div>
          <div class="card" style="padding:16px">
            <p class="muted" style="font-size:.75rem;margin:0 0 4px">น้ำดื่ม (มล.)</p>
            <p class="disp" style="font-size:1.4rem;font-weight:700;margin:0">${log.water_ml}</p>
            <input type="number" id="fWater" value="${log.water_ml}" style="margin-top:10px;height:36px;font-size:.85rem"/>
          </div>
          <div class="card" style="padding:16px">
            <p class="muted" style="font-size:.75rem;margin:0 0 4px">การนอนหลับ (ชม.)</p>
            <p class="disp" style="font-size:1.4rem;font-weight:700;margin:0">${log.sleep_hours}</p>
            <input type="number" step="0.5" id="fSleep" value="${log.sleep_hours}" style="margin-top:10px;height:36px;font-size:.85rem"/>
          </div>
          <div class="card" style="padding:16px">
            <p class="muted" style="font-size:.75rem;margin:0 0 4px">ออกกำลังกาย (นาที)</p>
            <p class="disp" style="font-size:1.4rem;font-weight:700;margin:0">${log.exercise_minutes}</p>
            <input type="number" id="fExMin" value="${log.exercise_minutes}" style="margin-top:10px;height:36px;font-size:.85rem"/>
          </div>
          <div style="grid-column:1/-1;display:flex;justify-content:flex-end">
            <button type="submit" class="btn-primary" ${saving?'disabled':''}>${saving?'กำลังบันทึก...':'✓ บันทึกข้อมูลประจำวัน'}</button>
          </div>
        </form>
        <section class="card">
          <h2 class="disp" style="font-weight:600;margin:0 0 16px;font-size:1.05rem">บันทึกอาหารและกิจกรรม</h2>
          ${favs.length>0 ? `<div class="quickrow" style="flex-wrap:wrap">
            ${favs.map((f,i)=>`<button type="button" class="pill" style="width:auto;padding:8px 12px;display:flex;align-items:center;gap:6px" data-fav="${i}">
              <span>${f.type==='meal'?'🍽':'🏃'} ${f.title} (${f.calories} kcal)</span>
              <span data-delfav="${i}" style="color:var(--error);font-weight:700">×</span>
            </button>`).join("")}
          </div>` : ``}
          <div class="quickrow">
            <select id="fType"><option value="meal">มื้ออาหาร</option><option value="exercise">การออกกำลังกาย</option></select>
            <input id="fTitle" placeholder="ชื่อรายการ เช่น ข้าวไก่ผัดกะเพรา"/>
            <input id="fKcal" type="number" placeholder="kcal" style="max-width:110px"/>
            <button id="saveFavBtn" type="button" class="btn-ghost" title="บันทึกเป็นรายการโปรด">☆</button>
            <button id="addBtn" class="btn-sub">+ เพิ่มรายการ</button>
          </div>
          <ul class="entries">
            ${entries.length===0 ? `<li class="muted" style="font-size:.9rem">ยังไม่มีรายการสำหรับวันนี้</li>` :
              entries.map(e=>`<li data-id="${e.id}">
                <div><span class="tag">${e.entry_type==='meal'?'🍽 มื้ออาหาร':'🏃 ออกกำลังกาย'}</span>${e.title}</div>
                <div style="display:flex;align-items:center;gap:12px">
                  <b class="disp">${e.calories} kcal</b>
                  <button data-del="${e.id}" style="background:none;border:none;color:var(--error);font-size:.85rem">ลบ</button>
                </div>
              </li>`).join("")}
          </ul>
        </section>
      </div>`);

      document.getElementById("fDate").onchange = async (e)=>{
        date = e.target.value; log = await getLog(user.id,date); entries = await getEntries(log.id); paint(false);
      };
      document.getElementById("logForm").onsubmit = async (e)=>{
        e.preventDefault();
        log.calories_consumed = Number(document.getElementById("fCal").value);
        log.water_ml = Number(document.getElementById("fWater").value);
        log.sleep_hours = Number(document.getElementById("fSleep").value);
        log.exercise_minutes = Number(document.getElementById("fExMin").value);
        const saved = await saveLog(user.id, date, log);
        if(saved) log = saved;
        paint(false);
      };
      document.getElementById("fType").onchange = (e)=>{ entryType = e.target.value; };
      document.getElementById("saveFavBtn").onclick = ()=>{
        const title = document.getElementById("fTitle").value.trim();
        const kcal = Number(document.getElementById("fKcal").value) || 0;
        if(!title) return;
        favs.push({ title, calories:kcal, type:entryType });
        saveFavs(user.email, favs);
        paint(false);
      };
      app.querySelectorAll("[data-delfav]").forEach(el=>{
        el.onclick = (ev)=>{
          ev.stopPropagation();
          favs.splice(Number(el.dataset.delfav), 1);
          saveFavs(user.email, favs);
          paint(false);
        };
      });
      app.querySelectorAll("[data-fav]").forEach(btn=>{
        btn.onclick = async (ev)=>{
          if(ev.target.hasAttribute("data-delfav")) return;
          const f = favs[Number(btn.dataset.fav)];
          if(!log.id){ const saved = await saveLog(user.id, date, log); if(saved) log = saved; }
          const entry = await addEntry(user.id, log.id, f.type, f.title, f.calories);
          if(entry) entries.push(entry);
          if(f.type === "meal") log.calories_consumed += f.calories; else log.exercise_kcal += f.calories;
          await saveLog(user.id, date, log);
          paint(false);
        };
      });
      document.getElementById("addBtn").onclick = async ()=>{
        const title = document.getElementById("fTitle").value.trim();
        const kcal = Number(document.getElementById("fKcal").value) || 0;
        if(!title) return;
        if(!log.id){ const saved = await saveLog(user.id, date, log); if(saved) log = saved; }
        const entry = await addEntry(user.id, log.id, entryType, title, kcal);
        if(entry) entries.push(entry);
        if(entryType === "meal") log.calories_consumed += kcal; else log.exercise_kcal += kcal;
        await saveLog(user.id, date, log);
        paint(false);
      };
      app.querySelectorAll("[data-del]").forEach(btn=>{
        btn.onclick = async ()=>{
          const id = btn.dataset.del;
          const entry = entries.find(x=>x.id===id);
          await deleteEntry(id);
          entries = entries.filter(x=>x.id!==id);
          if(entry){
            if(entry.entry_type==="meal") log.calories_consumed = Math.max(0, log.calories_consumed - entry.calories);
            else log.exercise_kcal = Math.max(0, log.exercise_kcal - entry.calories);
            await saveLog(user.id, date, log);
          }
          paint(false);
        };
      });
    }
    paint(false);
  }

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  applyTheme();
  render();
})();
